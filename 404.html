<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Single Page Apps for GitHub Pages</title>
  <script type="text/javascript">
    const pathSegmentsToKeep = 1;
    const scriptPathSegments = location.pathname.split('/').filter(s => s);
    const homepagePathSegments = scriptPathSegments.slice(0, pathSegmentsToKeep);
    history.replaceState(null, '', '/' + homepagePathSegments.join('/') + '/');
  </script>
</head>
